services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      MAILPIT_ENABLED: "true"
      MAILPIT_URL: http://mailpit:8025
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      N8N_PORT: 5678
    volumes:
      - n8n_data:/home/node/.n8n
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  n8n_data:
